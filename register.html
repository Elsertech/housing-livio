
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LIVIO Residences</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <main class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo">LIVIO<span>.</span></a>

            <h1>Create your account</h1>
            <p>Join LIVIO and experience better property management.</p>

            <form id="register-form">
                <label for="full_name">Full name</label>
                <input type="text" id="full_name" required placeholder="Enter your full name">

                <label for="email">Email address</label>
                <input type="email" id="email" required placeholder="Enter your email">

                <label for="phone">Phone number</label>
                <input type="tel" id="phone" required placeholder="+254 7XX XXX XXX">

                <label for="role">I want to register as</label>
                <select id="role" required>
                    <option value="">Select account type</option>
                    <option value="tenant">Tenant – Find a home</option>
                    <option value="landlord">Landlord – Manage properties</option>
                </select>

                <label for="password">Password</label>
                <input type="password" id="password" required minlength="8" placeholder="Minimum 8 characters">

                <button type="submit">Create Account</button>

                <p id="auth-message" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
